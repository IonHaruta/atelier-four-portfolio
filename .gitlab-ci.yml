stages:
  - build

.docker_build: &docker_build
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--mtu=1460"]
  tags:
    - build
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build_frontend:
  <<: *docker_build
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - export IMAGE="$CI_REGISTRY_IMAGE/frontend"
    - export TAG_SHA="${CI_COMMIT_SHORT_SHA}"
    - export TAG_REF="${CI_COMMIT_REF_SLUG}"
    - docker build --pull -f Dockerfile -t "$IMAGE:$TAG_SHA" -t "$IMAGE:$TAG_REF" --build-arg VITE_BASE=/ --build-arg VITE_API_URL= .
    - docker push "$IMAGE:$TAG_SHA"
    - docker push "$IMAGE:$TAG_REF"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "master" ]; then
        docker tag "$IMAGE:$TAG_SHA" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi

build_backend:
  <<: *docker_build
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - export IMAGE="$CI_REGISTRY_IMAGE/backend"
    - export TAG_SHA="${CI_COMMIT_SHORT_SHA}"
    - export TAG_REF="${CI_COMMIT_REF_SLUG}"
    - docker build --pull -f backend/Dockerfile -t "$IMAGE:$TAG_SHA" -t "$IMAGE:$TAG_REF" backend
    - docker push "$IMAGE:$TAG_SHA"
    - docker push "$IMAGE:$TAG_REF"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "master" ]; then
        docker tag "$IMAGE:$TAG_SHA" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
